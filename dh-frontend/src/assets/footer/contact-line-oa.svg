<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <!-- Floor Shadow -->
    <ellipse cx="24" cy="42" rx="14" ry="4" fill="url(#lineShadow)" />
    <radialGradient id="lineShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <!-- 3D Bubble Body Gradient -->
    <linearGradient id="lineBg" x1="8" y1="4" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="30%" stop-color="#16a34a"/>
      <stop offset="85%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>

    <!-- Gloss Arc -->
    <linearGradient id="lineGloss" x1="12" y1="6" x2="36" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#052e16" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Shadow -->
  <ellipse cx="24" cy="42" rx="14" ry="4" fill="url(#lineShadow)" />

  <!-- LINE Bubble Shape -->
  <path d="M24 6C13.5 6 5 13.6 5 23c0 5.4 2.8 10.2 7.3 13.4.6.4.9 1.1.8 1.8l-.8 4.2c-.2.9.7 1.6 1.5 1.1l5.4-3.3c.6-.4 1.3-.5 2-.4 1.8.4 3.7.6 5.8.6 10.5 0 19-7.6 19-17S34.5 6 24 6Z" 
        fill="url(#lineBg)"
        stroke="#86efac"
        stroke-width="1"
        stroke-opacity="0.4"/>

  <!-- Top Gloss Highlight -->
  <path d="M24 7.5c-9.5 0-17 6.7-17.4 15 2.5-5 8-8.5 15.4-8.5 6.5 0 12.2 2.7 15.5 6.8C36.8 11.8 31 7.5 24 7.5Z" 
        fill="url(#lineGloss)"/>

  <!-- Official Crisp LINE Typography -->
  <g fill="#ffffff" filter="url(#textGlow)">
    <!-- L -->
    <path d="M12.5 18h2.3v7.8h4.2v2h-6.5V18Z"/>
    <!-- I -->
    <path d="M20.5 18h2.3v9.8h-2.3V18Z"/>
    <!-- N -->
    <path d="M24.5 18h2.2l3.4 5.3V18h2.3v9.8h-2.1l-3.5-5.5v5.5h-2.3V18Z"/>
    <!-- E -->
    <path d="M34 18h6.2v2h-3.9v1.9h3.4v2h-3.4v1.9h4v2H34V18Z"/>
  </g>
</svg>
