<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <!-- Floor Shadow -->
    <ellipse cx="24" cy="42" rx="14" ry="4" fill="url(#phoneShadow)" />
    <radialGradient id="phoneShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <!-- Badge Sphere Gradient -->
    <linearGradient id="phoneBadge" x1="8" y1="4" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#0ea5e9"/>
      <stop offset="75%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Gloss Highlight -->
    <linearGradient id="phoneGloss" x1="12" y1="6" x2="36" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Handset 3D White-Silver Gradient -->
    <linearGradient id="handsetGrad" x1="15" y1="14" x2="33" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <filter id="handsetShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#075985" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Shadow -->
  <ellipse cx="24" cy="42" rx="14" ry="4" fill="url(#phoneShadow)" />

  <!-- Outer Rounded Capsule Badge -->
  <rect x="5" y="5" width="38" height="38" rx="19" fill="url(#phoneBadge)" stroke="#7dd3fc" stroke-width="1" stroke-opacity="0.45"/>

  <!-- Upper Glass Shine -->
  <path d="M6.5 21C7.8 12.5 15 6.5 24 6.5s16.2 6 17.5 14.5c-3.2-3.8-9.2-6.5-17.5-6.5S9.7 17.2 6.5 21Z" fill="url(#phoneGloss)"/>

  <!-- Handset Icon -->
  <path d="M16.5 15.2c-.8-.8-2-.8-2.8 0l-1.3 1.3c-1.4 1.4-1.6 3.6-.5 5.2 3.2 4.6 7 8.4 11.6 11.6 1.6 1.1 3.8.9 5.2-.5l1.3-1.3c.8-.8.8-2 0-2.8l-3-3c-.8-.8-2-.8-2.8 0l-.9.9c-.3.3-.8.4-1.2.2-2.1-1.1-3.8-2.8-4.9-4.9-.2-.4-.1-.9.2-1.2l.9-.9c.8-.8.8-2 0-2.8l-3.2-3.1Z" 
        fill="url(#handsetGrad)" 
        filter="url(#handsetShadow)"/>

  <!-- Sound Waves (Cyber-Pulse) -->
  <path d="M32 17c1.5 1.5 2.5 3.5 2.5 5.8s-1 4.3-2.5 5.8" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" stroke-opacity="0.9"/>
  <path d="M35.5 14c2.3 2.3 3.8 5.5 3.8 9s-1.5 6.7-3.8 9" stroke="#e0f2fe" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.6"/>
</svg>
